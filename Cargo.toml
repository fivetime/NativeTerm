[workspace]
resolver = "2"
members = [
    "crates/native-term-app",
    "crates/native-term-config",
    "crates/native-term-i18n",
    "crates/native-term-iterm2",
    "crates/native-term-os",
    "crates/native-term-session",
    "crates/native-term-platform",
    "crates/native-term-sftp",
    "crates/native-term-shim",
    "crates/native-term-wezterm",
    "crates/native-term-win",
    "prototypes/uia-probe",
    "prototypes/shim-probe",
    "prototypes/menu-hook",
    "prototypes/tab-switcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fivetime/NativeTerm"

# zmodem2 from our fork until the fixes are in a release: the cancel
# sequence on abort(), the ZFILE modification time and mode, and ESCCTL
# (offered upstream as codeberg.org/jarkko/zmodem2 pulls 8, 9 and 10).
# Pinned to a commit, as the fork goes away once they are merged; then
# this section goes too and the version below is raised.
[patch.crates-io]
zmodem2 = { git = "https://codeberg.org/fivetime/zmodem2.git", rev = "94aec18" }

[profile.release]
lto = true
strip = true

# Dependencies are optimized in debug builds too: the CPU renderer
# (egui_software_backend) rasterized a 480x900 part of the window at 200 %
# in 131 ms unoptimized, 3.8 ms optimized, so a debug build scrolled at a
# few frames per second. Our own crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 3
