[package]
name = "native-term-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nativeterm-shim"
path = "src/main.rs"

[dependencies]
native-term-i18n = { path = "../native-term-i18n" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
native-term-config = { path = "../native-term-config" }
native-term-session = { path = "../native-term-session" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
