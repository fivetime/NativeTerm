[package]
name = "native-term-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
native-term-win = { path = "../native-term-win" }
uiautomation = "0.25.1"
windows-core = "0.62.2"
# the version uiautomation uses, so raw interfaces are interchangeable
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
native-term-session = { path = "../native-term-session" }
tempfile = "3"
