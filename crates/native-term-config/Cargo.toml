[package]
name = "native-term-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# what it says when it refuses to write something
native-term-i18n = { path = "../native-term-i18n" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
# Han characters in labels become readable aliases
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
uuid = { version = "1", features = ["v4"] }
# non-SSH sessions beside each folder file (`*.nt.toml`)
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
native-term-win = { path = "../native-term-win" }
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
