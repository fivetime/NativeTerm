[package]
name = "native-term-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nativeterm"
path = "src/main.rs"

[dependencies]
native-term-i18n = { path = "../native-term-i18n" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
# painted on the CPU: see src/window.rs
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["accesskit", "clipboard", "links"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
softbuffer = { version = "0.4", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
native-term-config = { path = "../native-term-config" }
native-term-session = { path = "../native-term-session" }
native-term-platform = { path = "../native-term-platform" }
native-term-win = { path = "../native-term-win" }
native-term-sftp = { path = "../native-term-sftp" }
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
