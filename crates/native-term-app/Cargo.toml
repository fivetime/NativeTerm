[package]
name = "native-term-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nativeterm"
path = "src/main.rs"

[dependencies]
# wgpu, not glow: glutin 0.32.3's WGL config lookup trips a Vec::set_len
# precondition (undefined behavior) on this machine
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui = "0.29"
# eframe builds wgpu with Vulkan only; Direct3D 12 is the fallback
wgpu = { version = "22.1", default-features = false, features = ["dx12", "wgsl"] }
native-term-config = { path = "../native-term-config" }
native-term-session = { path = "../native-term-session" }
native-term-platform = { path = "../native-term-platform" }
native-term-win = { path = "../native-term-win" }
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
