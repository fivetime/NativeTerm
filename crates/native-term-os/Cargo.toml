[package]
name = "native-term-os"
version.workspace = true
edition.workspace = true
license.workspace = true

# On Windows every function is the Win32 helper it always was; elsewhere
# the same names over libc and the desktop's own tools.
[target.'cfg(windows)'.dependencies]
native-term-win = { path = "../native-term-win" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# docking asks the X server about frames, the work area and the pointer
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
